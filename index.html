<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SolarRise — Clean Energy Solutions</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --green: #1A7A4A;
  --green-light: #22A060;
  --accent: #3DD68C;
  --dark: #0F1A12;
  --white: #FFFFFF;
  --text: #111814;
  --text-mid: #4A5A50;
  --text-muted: #8A9E92;
  --border: #DDE8E0;
  --nav-h: 68px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}

/* NAV */
nav {
  position:fixed;
  top:0; left:0; right:0;
  height:var(--nav-h);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 6%;
  z-index:100;
  transition:0.3s;
}

/* DEFAULT HERO NAV (WHITE) */
.nav-logo {
  color:#fff;
  font-weight:800;
  text-decoration:none;
}

.nav-links a {
  color: rgba(255,255,255,0.85);
  text-decoration:none;
  margin:0 1rem;
  font-size:0.9rem;
}

.nav-links a:hover {
  color: var(--accent);
}

.nav-cta {
  color:#fff;
  border:1px solid rgba(255,255,255,0.3);
  padding:0.5rem 1rem;
  border-radius:100px;
  text-decoration:none;
}

/* hamburger white */
.hamburger span {
  display:block;
  width:22px;
  height:2px;
  margin:4px 0;
  background:#fff;
}

/* SCROLLED NAV */
nav.scrolled {
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(10px);
}

nav.scrolled .nav-logo,
nav.scrolled .nav-links a {
  color:var(--text-mid);
}

nav.scrolled .nav-cta {
  background:var(--green);
  color:#fff;
  border:none;
}

nav.scrolled .hamburger span {
  background:var(--dark);
}

/* HERO */
#home {
  min-height:100vh;
  background:var(--dark);
  position:relative;
  display:flex;
  align-items:center;
}

.hero-img {
  position:absolute;
  inset:0;
  background:url('../img/markus-spiske-rNn_TU8dvoY-unsplash.jpg') center/cover no-repeat;
  opacity:0.3;
}

.hero-overlay {
  position:absolute;
  inset:0;
  background: linear-gradient(
    to right,
    rgba(34,197,94,0.35),
    rgba(34,197,94,0.25) 40%,
    rgba(34,197,94,0.1),
    transparent
  );
}

/* HERO LAYOUT */
.hero-layout {
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  padding:0 6%;
  padding-top:var(--nav-h);
  gap:4rem;
}

.hero-content {
  max-width:850px;
}

.hero-tag {
  display:inline-flex;
  padding:5px 12px;
  border-radius:100px;
  background:rgba(61,214,140,0.14);
  border:1px solid rgba(61,214,140,0.28);
  color:var(--accent);
  margin-bottom:1.5rem;
}

h1 {
  font-family:'Fraunces';
  font-size:clamp(2.8rem,5vw,5rem);
  color:#fff;
  margin-bottom:1rem;
}

h1 em { color:var(--accent); font-style:normal; }

.hero-sub {
  color:rgba(255,255,255,0.7);
  max-width:480px;
  margin-bottom:2rem;
  line-height:1.7;
}

/* BUTTONS */
.hero-actions {
  display:flex;
  gap:1rem;
}

.nav-cta:hover {
  background:rgba(255,255,255,0.15);
}

/* STATS */
.hero-stats {
  display:flex;
  flex-direction:column;
  gap:1rem;
  align-items:flex-end;
}

.hero-stat {
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.14);
  backdrop-filter:blur(12px);
  padding:1rem 1.2rem;
  border-radius:16px;
  min-width:180px;
}

.hero-stat strong {
  font-family:'Fraunces';
  font-size:2rem;
  color:#fff;
  display:block;
}

.hero-stat span {
  font-size:0.7rem;
  color:rgba(255,255,255,0.4);
  text-transform:uppercase;
}

/* MOBILE */
@media (max-width:960px) {
  .hero-layout {
    flex-direction:column;
    align-items:flex-start;
  }

  .hero-stats {
    flex-direction:row;
    width:100%;
    justify-content:space-between;
  }

  .hero-stat {
    flex:1;
    text-align:center;
  }
}
</style>
</head>

<body>

<nav id="navbar">
  <a href="#" class="nav-logo">SolarRise</a>

  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>

  <a href="#" class="nav-cta">Get Quote</a>

  <div class="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </div>
</nav>

<section id="home">
  <div class="hero-img"></div>
  <div class="hero-overlay"></div>

  <div class="hero-layout">

    <div class="hero-content">
      <div class="hero-tag">Clean Energy Solutions</div>

      <h1>Power your future with <em>clean</em> solar energy</h1>

      <p class="hero-sub">
        Cut your electricity bills by up to 90% with premium solar installations.
      </p>

      <div class="hero-actions">
        <a href="#" class="nav-cta">Get a Free Quote</a>
      </div>
    </div>

    <div class="hero-stats">
      <div class="hero-stat">
        <strong>3,200+</strong>
        <span>Installations</span>
      </div>

      <div class="hero-stat">
        <strong>90%</strong>
        <span>Bill Reduction</span>
      </div>

      <div class="hero-stat">
        <strong>25yr</strong>
        <span>Warranty</span>
      </div>
    </div>

  </div>
</section>

<script>
const nav = document.getElementById("navbar");

window.addEventListener("scroll", () => {
  nav.classList.toggle("scrolled", window.scrollY > 40);
});
</script>

</body>
</html>
